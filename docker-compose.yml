version: '3.8'

services:
  modulunch-app:
    build:
      context: ./modulunch
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # map your app port
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/modulunchdb

  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
