version: '3.8'

services:
  modulunch-app:
    build:
      context: ./modulunch
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./modulunch:/app               # Mount your app source
      - /app/node_modules              # Prevent container node_modules from being overwritten
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/modulunchdb
    command: npm run dev              # Run the dev server instead of production build
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
